[project]
name = "recsys"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "duckdb>=1.1",
    "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recsys"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100