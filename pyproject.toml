[project]
name = "recsys"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=2.2,<3",
    "pyarrow>=16",
    "duckdb>=1.1",
    "pyyaml>=6",
    "fastapi>=0.162.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "ruff>=0.6",
]
train = [
    "faiss-cpu>=1.16.0",
    "lightgbm>=4.7.0",
    "mlflow>=3.18.0",
    "pyspark>=4.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recsys"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.uv]
default-groups = ["dev", "train"]   # on your laptop, install everything as before
